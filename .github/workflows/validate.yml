name: Validate MAKILA LAB
on:
  push:
    branches: [main, feature/openai-shirt-assistant]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML and inline JavaScript
        run: node scripts/validate-html.mjs
      - name: Validate OpenAI Netlify function syntax
        run: node --check netlify/functions/design-assistant.mjs
